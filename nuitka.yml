- module-name: 'PySide6'
  implicit-imports:
    - post-import-code:
        - |
          _wrap_compiled_methods = True
          _original_compiled_method_protect = protect

          def protect(func):
              if (
                  hasattr(func, "__compiled__")
                  and hasattr(func, "im_func")
                  and hasattr(func.im_func, "_slots")
              ):
                  _protected.append(func)
                  return func
              return _original_compiled_method_protect(func)