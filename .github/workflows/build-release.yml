name: Build tag release
run-name: Build release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach release assets to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            container: ''
            artifact-path: build/*.exe
          - target: ubuntu-22.04-x64
            runner: ubuntu-22.04
            container: ''
            artifact-path: build/*.deb
          - target: alma-9-x64
            runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_34_x86_64:latest
            artifact-path: build/**/*.rpm
    defaults:
      run:
        shell: bash
    steps:
      - name: Install additional AlmaLinux dependencies
        if: matrix.target == 'alma-9-x64'
        run: |
          dnf install -y \
            git ccache portaudio-devel \
            rpm-build redhat-rpm-config systemd-rpm-macros \
            pulseaudio-libs mesa-libGL mesa-libEGL fontconfig dbus-libs glib2 \
            libxkbcommon-x11 xcb-util-cursor xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil xcb-util-wm libXrender libXi libXext
          tar -xf /opt/_internal/static-libs-for-embedding-only.tar.xz -C /opt/_internal

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Install additional Ubuntu dependencies
        if: matrix.target == 'ubuntu-22.04-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache portaudio19-dev devscripts debhelper \
            libpulse0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-icccm4 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxrender1 libxi6 libxext6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          cache-local-path: .uv-cache

      - name: Restore build caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .nuitka-cache
            .uv-cache
          key: build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-${{ matrix.target }}-

      - name: Compile and package with build.py
        run: |
          export NUITKA_CACHE_DIR="$PWD/.nuitka-cache"
          uv run --no-project python build.py

      - name: Save build caches
        if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .nuitka-cache
            .uv-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Upload packages to draft release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Attest packages
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/**

      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true
          else
            gh release create "$TAG" --verify-tag --draft
          fi
          find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
