name: Dispatch tag release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-22.04
    steps:
      - name: Start build on master for the pushed tag
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { data: commit } = await github.rest.repos.getCommit({
              owner, repo, ref: context.ref,
            });
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'build-release.yml',
              ref: 'master',
              inputs: { tag, sha: commit.sha },
            });
            await core.summary
              .addHeading(`Dispatched release build: ${tag}`)
              .addRaw(`Build workflow runs on master; source commit: ${commit.sha}.`)
              .addLink('View build runs', `${context.serverUrl}/${owner}/${repo}/actions/workflows/build-release.yml`)
              .write();
