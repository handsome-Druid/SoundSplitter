<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>Rounded SS Headphones Logo</title>

  <defs>
    <!-- 单一 S：两个实例只做平移，形状完全相同 -->
    <!-- 路径关于 (400,400) 180° 旋转对称 -->
    <path id="S"
      d="M 474 304
         C 438 266 328 260 328 334
         C 328 382 374 392 400 400
         C 426 408 472 418 472 466
         C 472 540 362 534 326 496"
      fill="none"
      stroke="#111"
      stroke-width="62"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </defs>

  <!-- 宽、矮、圆润的实心耳机头梁 -->
  <path d="M 112 402
           V 340
           C 112 174 238 78 400 78
           C 562 78 688 174 688 340
           V 402
           H 630
           V 342
           C 630 216 534 136 400 136
           C 266 136 170 216 170 342
           V 402
           Z"
        fill="#111"/>

  <!-- 大号、圆润、实心半圆耳罩 -->
  <path d="M 166 350
           C 82 350 48 414 48 490
           C 48 566 82 630 166 630
           C 194 630 214 610 214 580
           V 400
           C 214 370 194 350 166 350
           Z"
        fill="#111"/>

  <path d="M 634 350
           C 718 350 752 414 752 490
           C 752 566 718 630 634 630
           C 606 630 586 610 586 580
           V 400
           C 586 370 606 350 634 350
           Z"
        fill="#111"/>

  <!-- 两个完全相同的胖圆 S，仅位移 -->
  <use href="#S" transform="translate(-58 -45)"/>
  <use href="#S" transform="translate(58 45)"/>
</svg>
