[project]
name = "SoundSplitter"
dynamic = ["version"]
description = "Windows 音频分流工具，将输入音频的左右声道分别输出到两个设备，支持音量跟随和延迟调整。"
authors = [{ name = "山泥若叶睦" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ashka[lifecycle]>=1.0.0",
    "av>=19.0.0",
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "dishka>=1.10.1",
    "pulsectl>=24.12.0 ; sys_platform == 'linux'",
    "pyaudio>=0.2.14 ; sys_platform != 'win32'",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pydantic>=2.13.5",
    "pydantic-yaml>=1.7.0",
    "pyside6>=6.11.2",
    "shiboken6>=6.11.2",
]

[project.scripts]
SoundSplitter = "SoundSplitter:main"

[project.urls]
Repository = "https://github.com/handsome-Druid/SoundSplitter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/setup/__about__.py"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]

[tool.ruff]
lint.ignore = ["N999"]
extend-exclude = [
    "**/**_ui.py",
    "**/**_rc.py",
]
force-exclude = true

[tool.pyright]
exclude = [
    "**/**_ui.py",
    "**/**_rc.py",
]
ignore = [
    "**/**_ui.py",
    "**/**_rc.py",
]

[tool.deptry]
exclude = [
    "**/**_ui.py",
    "**/**_rc.py",
]
